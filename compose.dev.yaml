services:
  backend:
    build:
      target: development
    restart: "no"
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      target: development
    restart: "no"
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
