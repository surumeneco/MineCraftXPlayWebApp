name: Notice implementation verification

on:
  push:
    branches:
      - feature/notice-backend
    paths-ignore:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: xplay_test
          POSTGRES_USER: xplay_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xplay_test -d xplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://xplay_test:local-ci-only@127.0.0.1:5432/xplay_test
      NODE_ENV: test
      FRONTEND_ORIGIN: http://localhost:3000
      PUBLIC_API_BASE: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies and synchronize lockfile
        run: npm install --ignore-scripts
      - name: Commit dependency lockfile if updated
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package-lock.json
            git commit -m "chore: synchronize notice backend lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Database migrations
        run: npm run db:migrate --workspace @xplay/backend
      - name: Backend unit tests
        run: npm run test:backend
      - name: Build workspaces
        run: npm run build
      - name: Public and unauthorized API smoke test
        shell: bash
        run: |
          npm run start:prod --workspace @xplay/backend > /tmp/xplay-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/xplay-backend.log' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3001/api/health; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          test "$(curl -s -o /tmp/list.json -w '%{http_code}' http://localhost:3001/api/notices)" = 200
          node -e 'const a=JSON.parse(require("node:fs").readFileSync("/tmp/list.json"));if(!Array.isArray(a))process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:3001/api/admin/notices)" = 401
